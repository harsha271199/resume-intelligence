# pyproject.toml — project metadata and local tooling configuration
#
# NOTE: The [build-system] table has been intentionally removed.
# Streamlit Cloud interprets a [build-system] entry as an instruction to
# pip-install this project as a package, which fails with:
#   ModuleNotFoundError: No module named 'setuptools.backends'
#
# The project uses a src-layout with sys.path injection in app.py instead.
# No package installation is needed for deployment.

[project]
name = "resume-intelligence"
version = "0.1.0"
description = "A Multi-Agent Framework for Structured and Fair Resume Intelligence"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Harshavardhan Balraj Kagithoju" },
    { name = "Naveen Kumar Artham" },
]
keywords = ["resume", "nlp", "fairness", "bias-detection", "job-matching"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
]

# ── Local development tooling ─────────────────────────────────────────────────
# These sections are used by pytest and coverage locally.
# They are NOT read by Streamlit Cloud.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/resume_intelligence --cov-report=term-missing"

[tool.coverage.run]
source = ["src/resume_intelligence"]
omit = ["tests/*"]
