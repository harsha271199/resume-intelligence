[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "resume-intelligence"
version = "0.1.0"
description = "A Multi-Agent Framework for Structured and Fair Resume Intelligence"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Harshavardhan Balraj Kagithoju" },
    { name = "Naveen Kumar Artham" },
]
keywords = ["resume", "nlp", "fairness", "bias-detection", "job-matching"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "spacy>=3.7.0",
    "sentence-transformers>=2.7.0",
    "streamlit>=1.35.0",
    "matplotlib>=3.8.0",
    "networkx>=3.3.0",
    "pydantic>=2.7.0",
    "fairlearn>=0.10.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "seqeval>=1.2.2",
    "datasets>=2.19.0",
    "scipy>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
]

[project.scripts]
resume-intel = "resume_intelligence.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/resume_intelligence --cov-report=term-missing"

[tool.coverage.run]
source = ["src/resume_intelligence"]
omit = ["tests/*"]
